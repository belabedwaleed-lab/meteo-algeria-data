name: ARPEGE Algeria

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: "discover fields only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: arpege
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install meteofetch pandas numpy xarray

      - name: Discover fields
        if: ${{ inputs.discover }}
        run: python arpege/extract_arpege.py --discover

      - name: Build arpege.json
        if: ${{ !inputs.discover }}
        run: |
          mkdir -p data
          python arpege/extract_arpege.py --out data/arpege.json

      - name: Commit
        if: ${{ !inputs.discover }}
        run: |
          git config user.name "arpege-bot"
          git config user.email "arpege-bot@users.noreply.github.com"
          git add data/arpege.json
          git diff --cached --quiet || (git commit -m "ARPEGE update" && git push)
